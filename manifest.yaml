description: "Where is this pull request's code really? Follows a PR through stacked branches to the default branch and each deploy environment, explains in plain words what blocks an open one, and spots stranded PRs that look merged but never shipped. Read-only, no AI model. Reads GitHub through the gh CLI or GitHub's MCP server."
